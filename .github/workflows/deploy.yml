name: Deploy Fullstack Pet Project

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker image prune -f

      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="Деплой успешно завершен!"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="Ошибка при деплое!"
          fi

          MESSAGE="${STATUS_ICON} <b>${STATUS_TEXT}</b>%0A%0A📦 <b>Проект:</b> ${{ github.repository }}%0A💬 <b>Коммит:</b> ${{ github.event.head_commit.message }}%0A🔗 <a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>Открыть логи сборки</a>"

          curl -s -X POST "https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
