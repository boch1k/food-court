name: Deploy Fullstack Pet Project

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          docker image prune -f

      - name: Send Telegram notification
        if: always()
        run: |
          STATUS="✅ Деплой успешно завершен!"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ Ошибка при деплое!"
          fi

          curl -4 -sS -X POST "https://api.telegram.org/bot{{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=${STATUS} (${{ github.repository }})"
