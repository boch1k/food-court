services:
  frontend:
    build: .
    container_name: my-react-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - json-api

  json-api:
    image: node:20-alpine
    container_name: my-json-server
    working_dir: /data
    # Устанавливаем json-server и запускаем его на файле db.json
    command: sh -c "npx -y json-server@1.0.0-beta.15 db.json --host 0.0.0.0 --port 3001"
    volumes:
      # линк файла на сервере с файлом внутри контейнера
      - /home/github-runner/app-data/db.json:/data/db.json
    restart: always
